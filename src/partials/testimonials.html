<!-- styles: css/testimonials.css (imported globally via global.css; + global.css for shared tokens/utilities) -->
<section class="testi-band">

    <div class="section-head center reveal">
      <span class="eyebrow">Відгуки клієнтів</span>
      <h2>Що кажуть підприємства, з якими ми працюємо</h2>
    </div>
    <div class="testi-wrap">
      <button class="testi-arrow prev" id="testiPrev" aria-label="Попередній">&larr;</button>
      <div class="testi-viewport">
        <div class="testi-track" id="testiTrack"></div>
      </div>
      <button class="testi-arrow next" id="testiNext" aria-label="Наступний">&rarr;</button>
      <div class="testi-dots" id="testiDots"></div>
    </div>
  </div>
</section>
